<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FB profile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(400px 400px at 50% 50%, rgba(56,189,248,0.35) 0%, transparent 60%),
      radial-gradient(400px 400px at 30% 80%, rgba(52,211,153,0.25) 0%, transparent 55%),
      linear-gradient(180deg, #04060B 0%, #0B1424 55%, #061019 100%);
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
  }
  .mark {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mark-inner {
    width: 300px; height: 300px;
    background-image: url('../images/logo.png?v=2');
    background-repeat: no-repeat;
    background-size: 1230px auto;      /* enlarged so sphere fills the disc */
    background-position: -20px center;  /* pan to isolate sphere */
    filter: drop-shadow(0 12px 40px rgba(56,189,248,0.5));
  }
</style>
</head>
<body>
  <div class="mark"><div class="mark-inner"></div></div>
</body>
</html>
