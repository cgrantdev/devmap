<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FB cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1640px; height: 628px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    position: relative;
    background:
      radial-gradient(1000px 700px at 78% 25%, rgba(56,189,248,0.22) 0%, transparent 55%),
      radial-gradient(900px 700px at 20% 85%, rgba(34,197,94,0.20) 0%, transparent 55%),
      linear-gradient(180deg, #04060B 0%, #0B1424 55%, #061019 100%);
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
  }
  /* Big sphere decoration bleeding off the right edge, low opacity */
  .mark-bg {
    position: absolute;
    top: -180px; right: -180px;
    width: 900px; height: 900px;
    background-image: url('../images/logo.png?v=2');
    background-repeat: no-repeat;
    background-size: 3700px auto;
    background-position: -60px center;
    opacity: 0.10;
    transform: rotate(-6deg);
    pointer-events: none;
  }

  /* FB crops ~15% off top/bottom on mobile — keep content inside 460px vertical.
     Total height 628, so safe zone is roughly y=84 to y=544. Center content. */
  .card {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 100px;
    z-index: 2;
  }

  .logo-row { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
  .logo-mark {
    width: 78px; height: 78px;
    background-image: url('../images/logo.png?v=2');
    background-repeat: no-repeat;
    background-size: 320px auto;
    background-position: -6px center;
  }
  .wordmark {
    display: inline-flex; align-items: baseline;
    font-size: 56px; line-height: 1; letter-spacing: -0.03em; color: #fff;
  }
  .wordmark .peptide { font-weight: 300; }
  .wordmark .map     { font-weight: 800; letter-spacing: -0.035em; }

  .headline {
    font-size: 68px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02;
    max-width: 1000px;
  }
  .headline .grad {
    background: linear-gradient(120deg, #38bdf8 0%, #34d399 55%, #a7f3d0 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    margin-top: 22px;
    font-size: 24px; line-height: 1.4; color: rgba(226,232,240,0.78); font-weight: 400;
    max-width: 900px;
  }
  .url-pill {
    display: inline-flex; align-items: center; gap: 12px;
    margin-top: 34px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 18px; color: rgba(255,255,255,0.9); font-weight: 500;
    padding: 12px 20px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    align-self: flex-start;
  }
  .url-pill .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 12px 2px rgba(16,185,129,0.55); }
</style>
</head>
<body>
  <div class="mark-bg"></div>
  <div class="card">
    <div class="logo-row">
      <div class="logo-mark"></div>
      <div class="wordmark"><span class="peptide">peptide</span><span class="map">map</span></div>
    </div>
    <div class="headline">Compare every <span class="grad">peptide vendor.</span></div>
    <div class="sub">Verified suppliers, live pricing, real COAs, and exclusive coupons — the peptide vendor directory.</div>
    <div class="url-pill"><span class="dot"></span>peptidemap.com</div>
  </div>
</body>
</html>
